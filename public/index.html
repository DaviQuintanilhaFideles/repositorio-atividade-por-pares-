<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Futuro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="public/css/style.css">
</head>

<body style="background-color: #f0fff0;">

    <!-- Cabeçalho -->
    <header class="site-header d-flex flex-wrap align-items-center justify-content-between p-4">
        <div class="logo text-white fw-bold fs-3">Verde Futuro</div>

        <nav class="menu-principal">
            <ul class="d-flex flex-wrap gap-3">
                <li><a href="#" class="nav-link" data-pagina="home">Home</a></li>
                <li><a href="#" class="nav-link" data-pagina="sobre">Sobre</a></li>
                <li><a href="#" class="nav-link" data-pagina="servicos">Serviços</a></li>
                <li><a href="#" class="nav-link" data-pagina="contatos">Contatos</a></li>
                <li><a href="#" class="nav-link" data-pagina="doacoes">Doações</a></li>
                <li><a href="#" class="nav-link" data-pagina="localizacoes">Localizações</a></li>
            </ul>
        </nav>

        <!-- Barra de pesquisa -->
        <form class="barra-de-pesquisa-header d-flex" action="#" method="GET">
            <input type="text" placeholder="Buscar..." name="buscar">
            <button type="submit">🔍</button>
        </form>
    </header>

    <!-- Área de conteúdo dinâmica -->
    <main class="container my-4" id="conteudo"></main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dados do site (simulando conteudo.json) -->
    <script>
        window.conteudo = {
            "home": {
                "titulo": "🌱 Bem-vindo à Verde Futuro 🌱",
                "html": `
          <!-- Carrossel -->
          <section class="my-4">
            <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
              <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
              </div>
              <div class="carousel-inner rounded-4 shadow">
                <div class="carousel-item active">
                  <img src="https://picsum.photos/id/1018/1200/400" class="d-block w-100" alt="Natureza">
                  <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                    <h5>Preservar é viver</h5>
                    <p>Juntos, podemos transformar o meio ambiente em um futuro mais verde.</p>
                  </div>
                </div>
                <div class="carousel-item">
                  <img src="https://picsum.photos/id/1021/1200/400" class="d-block w-100" alt="Reflorestamento">
                  <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                    <h5>Reflorestar para renascer</h5>
                    <p>Recuperar áreas degradadas e devolver vida à natureza.</p>
                  </div>
                </div>
                <div class="carousel-item">
                  <img src="https://picsum.photos/id/1032/1200/400" class="d-block w-100" alt="Educação ambiental">
                  <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                    <h5>Educar para mudar</h5>
                    <p>Pequenas atitudes criam grandes transformações.</p>
                  </div>
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
              </button>
            </div>
          </section>

          <!-- Cards de projetos -->
          <section class="my-5">
            <h2 class="text-center text-success mb-4">Projetos em Destaque</h2>
            <div class="row row-cols-1 row-cols-md-3 g-4">
              
              <div class="col">
                <div class="card h-100 shadow-sm">
                  <img src="https://picsum.photos/id/1040/400/250" class="card-img-top" alt="Reflorestamento">
                  <div class="card-body">
                    <h5 class="card-title">Projeto Reflorestamento</h5>
                    <p class="card-text">Ações de plantio de árvores em áreas degradadas, promovendo a recuperação ambiental e a biodiversidade.</p>
                  </div>
                  <div class="card-footer text-success fw-bold">Meio Ambiente</div>
                </div>
              </div>

              <div class="col">
                <div class="card h-100 shadow-sm">
                  <img src="https://picsum.photos/id/1050/400/250" class="card-img-top" alt="Horta Comunitária">
                  <div class="card-body">
                    <h5 class="card-title">Horta Comunitária</h5>
                    <p class="card-text">Criação e manutenção de hortas coletivas para fortalecer a alimentação saudável e o convívio comunitário.</p>
                  </div>
                  <div class="card-footer text-success fw-bold">Sustentabilidade</div>
                </div>
              </div>

              <div class="col">
                <div class="card h-100 shadow-sm">
                  <img src="https://picsum.photos/id/1060/400/250" class="card-img-top" alt="Educação Ambiental">
                  <div class="card-body">
                    <h5 class="card-title">Educação Ambiental</h5>
                    <p class="card-text">Oficinas e palestras em escolas e comunidades, incentivando práticas ecológicas e consciência ambiental.</p>
                  </div>
                  <div class="card-footer text-success fw-bold">Educação</div>
                </div>
              </div>

            </div>
          </section>
        `
            },
            "sobre": { "titulo": "Sobre Nós", "html": "<p>A Verde Futuro acredita que sustentabilidade e solidariedade caminham juntas.</p>" },
            "servicos": { "titulo": "Serviços", "html": "<p>Conheça nossos projetos e serviços voltados à comunidade.</p>" },
            "contatos": { "titulo": "Contatos", "html": "<p>Entre em contato conosco através do formulário.</p>" },
            "doacoes": { "titulo": "Doações", "html": "<p>Faça doações e ajude nossos projetos.</p>" },
            "localizacoes": { "titulo": "Localizações", "html": "<p>Veja onde atuamos e participe.</p>" }
        };
    </script>

    <!-- Script para navegação SPA -->
    <script>
        function carregarPagina(pagina = "home") {
            const area = document.getElementById("conteudo");
            const paginaSelecionada = window.conteudo[pagina];

            if (!paginaSelecionada) {
                area.innerHTML = "<p>Página não encontrada.</p>";
                return;
            }

            area.innerHTML = `<h2 class="text-center text-success mb-4">${paginaSelecionada.titulo}</h2>${paginaSelecionada.html}`;
        }

        document.querySelectorAll(".nav-link").forEach(link => {
            link.addEventListener("click", e => {
                e.preventDefault();
                carregarPagina(link.getAttribute("data-pagina"));
            });
        });

        // Carrega home por padrão
        carregarPagina("home");
    </script>

</body>

</html>
